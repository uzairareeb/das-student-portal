{% extends "base.html" %}
{% block body_class %}has-sidebar{% endblock %}
{% block sidebar %}
{% if dept %}
<aside class="sidebar dept-sidebar" id="sidebar">
  <div class="side-brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
    <div>
      <div class="t1">{{ dept.name }}</div>
      <div class="t2">Department Portal</div>
    </div>
  </div>
  <nav class="side-nav">
    <a href="{{ url_for('dept_dashboard') }}" class="{% if request.endpoint == 'dept_dashboard' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Uploads
    </a>
    <a href="{{ url_for('dept_students') }}" class="{% if request.endpoint == 'dept_students' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      My Students
    </a>
    <a href="{{ url_for('dept_viva') }}" class="{% if request.endpoint in ['dept_viva', 'dept_viva_edit'] %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Viva Tracking
    </a>
    <a href="{{ url_for('dept_template') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Template
    </a>
  </nav>
  <div class="side-foot">
    <a href="{{ url_for('dept_logout') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </a>
  </div>
</aside>
<button class="side-toggle" id="sideToggle" aria-label="Menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
{% endif %}
{% endblock %}
{% block page_scripts %}
<script>
  (function () {
    var t = document.getElementById('sideToggle');
    if (t) t.addEventListener('click', function () {
      document.body.classList.toggle('sidebar-open');
    });
    var sb = document.getElementById('sidebar');
    if (sb) sb.addEventListener('click', function (e) {
      if (e.target.closest('a')) document.body.classList.remove('sidebar-open');
    });
  })();
</script>
{% endblock %}
