{% extends "dept_base.html" %}
{% block content %}
<nav class="crumb" aria-label="Breadcrumb">Department Portal <span>/ Viva Tracking / Edit</span></nav>
<div class="page-head">
  <div>
    <h2>Edit Viva Record</h2>
    <p>{{ v.student_name }} ({{ v.reg_no }})</p>
  </div>
  <a class="btn ghost sm" href="{{ url_for('dept_viva') }}">&larr; Back to Viva Tracking</a>
</div>

<div class="card section">
  <form method="post">
    <div class="form-grid">
      <div>
        <label class="f-label" for="examiner_name">Examiner Name *</label>
        <input class="no-icon" type="text" id="examiner_name" name="examiner_name" required
               value="{{ v.examiner_name }}">
      </div>
      <div>
        <label class="f-label" for="examiner_affiliation">Examiner Affiliation</label>
        <input class="no-icon" type="text" id="examiner_affiliation" name="examiner_affiliation"
               value="{{ v.examiner_affiliation or '' }}">
      </div>
      <div>
        <label class="f-label" for="viva_date">Viva Date</label>
        <input class="no-icon" type="date" id="viva_date" name="viva_date" value="{{ v.viva_date or '' }}">
      </div>
      <div>
        <label class="f-label" for="result">Result</label>
        <select class="no-icon" id="result" name="result">
          {% for r in results %}<option value="{{ r }}" {% if v.result == r %}selected{% endif %}>{{ r }}</option>{% endfor %}
        </select>
      </div>
      <div id="marksFields">
        <label class="f-label" for="total_marks">Total Marks</label>
        <input class="no-icon" type="number" id="total_marks" name="total_marks" min="1"
               value="{{ v.total_marks or 120 }}">
      </div>
      <div id="obtainedFields">
        <label class="f-label" for="obtained_marks">Obtained Marks</label>
        <input class="no-icon" type="number" id="obtained_marks" name="obtained_marks" min="0"
               value="{{ v.obtained_marks if v.obtained_marks is not none else '' }}" placeholder="e.g. 95">
      </div>
      <div id="nextDateFields">
        <label class="f-label" for="next_viva_date">Next Viva Date</label>
        <input class="no-icon" type="date" id="next_viva_date" name="next_viva_date"
               value="{{ v.next_viva_date or '' }}">
      </div>
      <div class="full">
        <label class="f-label" for="remarks">Remarks</label>
        <input class="no-icon" type="text" id="remarks" name="remarks" value="{{ v.remarks or '' }}">
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button type="submit" class="btn primary">Save Changes</button>
      <a class="btn ghost" href="{{ url_for('dept_viva') }}">Cancel</a>
    </div>
  </form>
  <script>
  (function () {
    var result = document.getElementById('result');
    var marks = document.getElementById('marksFields');
    var obtained = document.getElementById('obtainedFields');
    var nextDate = document.getElementById('nextDateFields');
    function toggle() {
      var v = result.value;
      var showMarks = (v === 'Pass' || v === 'Fail');
      var showNext = (v === 'Fail' || v === 'Rescheduled');
      if (marks) marks.style.display = showMarks ? '' : 'none';
      if (obtained) obtained.style.display = showMarks ? '' : 'none';
      if (nextDate) nextDate.style.display = showNext ? '' : 'none';
    }
    if (result) { result.addEventListener('change', toggle); toggle(); }
  })();
  </script>
</div>
{% endblock %}
