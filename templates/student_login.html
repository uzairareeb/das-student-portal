{% extends "base.html" %}
{% block content %}
<div class="auth-wrap premium">
  <div class="card auth-card premium">
        <h2>Student Portal</h2>
    <p class="lede">Access your academic record and upload your documents.<br>Sign in with your Registration No. — your default password is your <strong>CNIC digits</strong> (without dashes).</p>
    <form method="post">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <div class="input-group">
                <input class="no-icon" type="text" name="reg_no" placeholder="Registration No. (e.g. 24-DAS-0101)" required autofocus autocomplete="off">
      </div>
      <div class="input-group">
                <input class="no-icon" type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn primary block">
        Sign In Securely
      </button>
    </form>
  </div>
</div>
{% endblock %}
