{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <h2>Student Login</h2>
    <p class="lede">Sign in with your Registration No. Your default password is your <strong>CNIC digits</strong> (without dashes).</p>
    <form method="post">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <div class="input-group">
        <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8.5" cy="10.5" r="2"/><path d="M5.5 17c.6-1.8 1.7-2.7 3-2.7s2.4.9 3 2.7"/><line x1="14" y1="9" x2="18.5" y2="9"/><line x1="14" y1="12.5" x2="18.5" y2="12.5"/><line x1="14" y1="16" x2="17" y2="16"/></svg></span>
        <input type="text" name="reg_no" placeholder="Registration No. (e.g. 24-DAS-0101)" required autofocus autocomplete="off">
      </div>
      <div class="input-group">
        <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn primary block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1 2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
