<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — {{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="ref2-page">
  <div class="ref2-card">
    <!-- Form side -->
    <section class="ref2-left">
      <div class="ref2-form">
        <h2>Login</h2>
        <p class="ref2-sub">Restricted area &mdash; sign in to manage student records.</p>
        <form method="post" id="loginForm">
          {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
          <div class="ref2-pw">
            <svg class="ref2-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="ref2-input" type="password" name="password" id="adminPw" placeholder="Password" required autofocus>
            <button type="button" class="ref2-show" id="pwToggle" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="ref2-row">
            <label class="ref2-remember"><input type="checkbox" name="remember" value="1"> Remember Me</label>
            <a class="ref2-home" href="{{ url_for('index') }}">Back to Home</a>
          </div>
          <button type="submit" class="ref2-submit" id="loginBtn">LOGIN</button>
        </form>
        <p class="ref2-note">Authorized personnel only. All sign-ins are logged.</p>
      </div>
    </section>

    <!-- Welcome panel -->
    <section class="ref2-right">
      <svg class="ref2-poly" viewBox="0 0 600 520" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="600,0 600,170 430,70" fill="#93C5FD" opacity="0.55"/>
        <polygon points="430,70 600,170 520,310" fill="#3B82F6" opacity="0.7"/>
        <polygon points="520,310 600,170 600,520" fill="#1D4ED8" opacity="0.6"/>
        <polygon points="300,0 430,70 600,0" fill="#BFDBFE" opacity="0.5"/>
        <polygon points="430,70 520,310 380,240" fill="#60A5FA" opacity="0.55"/>
        <polygon points="380,240 520,310 460,520" fill="#1E40AF" opacity="0.55"/>
        <polygon points="520,310 600,520 460,520" fill="#3B82F6" opacity="0.5"/>
        <polygon points="300,0 380,240 180,120" fill="#93C5FD" opacity="0.4"/>
        <polygon points="180,120 380,240 300,520" fill="#3B82F6" opacity="0.45"/>
        <polygon points="0,0 300,0 180,120" fill="#DBEAFE" opacity="0.35"/>
      </svg>
      <div class="ref2-welcome">
        <div class="ref2-logo">
          <img src="{{ url_for('static', filename='img/cuvas-logo.png') }}" alt="CUVAS logo">
        </div>
        <h1>Welcome<br>Back.</h1>
        <p>Cholistan University of Veterinary and Animal Sciences, Bahawalpur &mdash; {{ uni }}. {{ title }}.</p>
      </div>
    </section>
  </div>
  <script>
  (function () {
    var pw = document.getElementById('adminPw');
    var tg = document.getElementById('pwToggle');
    var eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    var eyeOff = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    tg.addEventListener('click', function () {
      var show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      tg.innerHTML = show ? eyeOff : eye;
      tg.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      pw.focus();
    });
    document.getElementById('loginForm').addEventListener('submit', function () {
      var b = document.getElementById('loginBtn');
      b.disabled = true;
      b.textContent = 'Signing in\u2026';
    });
  })();
  </script>
</body>
</html>
