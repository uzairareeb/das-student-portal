{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
        <h2>Admin Login</h2>
    <p class="lede">Restricted area &mdash; sign in to manage student records.</p>
    <form method="post">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <div class="input-group">
                <input class="no-icon" type="password" name="password" placeholder="Admin password" required autofocus>
      </div>
      <button type="submit" class="btn primary block">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
