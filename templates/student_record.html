{% extends "student_base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h2>Settings</h2>
    <p>{{ s.name }} &middot; {{ s.reg_no }}</p>
  </div>
</div>

<div class="card section">
  <div class="section-head">
    <span class="section-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
    <h3>Security — Change Password</h3>
  </div>
  <form method="post" action="{{ url_for('student_change_password') }}">
    <div class="form-grid">
      <div>
        <label class="f-label" for="current">Current password</label>
        <input class="no-icon" type="password" id="current" name="current" required>
      </div>
      <div>
        <label class="f-label" for="new">New password (min 6 characters)</label>
        <input class="no-icon" type="password" id="new" name="new" required>
      </div>
      <div>
        <label class="f-label" for="confirm">Confirm new password</label>
        <input class="no-icon" type="password" id="confirm" name="confirm" required>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <button type="submit" class="btn primary sm">Change Password</button>
    </div>
  </form>
</div>
{% endblock %}
