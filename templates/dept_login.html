{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
        <h2>Department Portal</h2>
    <p class="lede">Sign in with the email and password given by the DAS office.</p>
    <form method="post">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <div class="input-group">
                <input class="no-icon" type="email" name="email" placeholder="Department email" required autofocus>
      </div>
      <div class="input-group">
                <input class="no-icon" type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn primary block">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
